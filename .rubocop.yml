inherit_gem:
  axn: .rubocop.yml

# Exclude arrays MERGE (union) across the inheritance chain rather than replace. Without this,
# inheriting axn's `AllCops/Exclude` would clobber rubocop's built-in excludes (`vendor/**/*`,
# `node_modules/**/*`, …); and axn's own copies of those globs resolve relative to the axn gem dir
# (the inherit_gem relative-path gotcha), so they don't cover THIS project's dirs.
inherit_mode:
  merge:
    - Exclude

# Local deltas only — everything else (the AllCops preamble and the shared Style/Metrics rules) is
# inherited from axn's shared config above.

# Re-declare, relative to this project, the excludes CI depends on: `bundler-cache` installs gems
# into ./vendor/bundle, so without this rubocop lints the installed gems (bin stubs, axn's examples).
AllCops:
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"

# The hyphenated entry file (lib/axn-ruby_llm.rb) intentionally defines Axn::RubyLLM; axn's shared
# config doesn't touch Naming/FileName, so this is a genuine local exclude.
Naming/FileName:
  Exclude:
    - "lib/axn-ruby_llm.rb"

# axn's shared set is `e, on, id, if, as`; `t` is used locally. Array values REPLACE (not merge)
# under inheritance, so this must be the full intended set, not just the addition.
Naming/MethodParameterName:
  AllowedNames: e, on, id, if, as, t

# axn's shared config sets Style/StringLiterals (double_quotes) but NOT the interpolation variant,
# whose rubocop default is single_quotes — so keep this locally to hold double-quote consistency
# inside interpolations too.
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
